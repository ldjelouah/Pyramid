name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Envoi du site, dans un job séparé comme le recommande actions/deploy-pages.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      # Le service d'archives de GitHub peut mettre quelques secondes à lister l'archive
      # qui vient d'être envoyée ; deploy-pages ne la cherche qu'une fois. En cas d'échec,
      # on attend puis on retente une fois.
      - name: Deploy
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before retrying
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Deploy (retry)
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
